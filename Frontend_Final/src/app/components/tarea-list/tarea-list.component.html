<mat-card>
  <mat-card-header>
    <mat-card-title>Gestión de Tareas</mat-card-title>
    <button mat-raised-button color="primary" routerLink="/tareas/crear">
      <mat-icon>add</mat-icon> Nueva Tarea
    </button>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Filtrar por estado</mat-label>
      <mat-select [(ngModel)]="filtroEstado" (selectionChange)="filtrarTareas()">
        <mat-option value="todas">Todas</mat-option>
        <mat-option *ngFor="let estado of estados | keyvalue" [value]="estado.value">
          {{ estado.value }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <ng-container *ngIf="!loading && !error; else loadingOrErrorTpl">
      <div *ngIf="tareasFiltradas.length === 0" class="no-data">
        No hay tareas para mostrar
      </div>

      <div *ngIf="tareasFiltradas.length > 0" class="tareas-grid">
        <mat-card *ngFor="let tarea of tareasFiltradas" class="tarea-card {{ getEstadoClase(tarea.estado) }}">
          <mat-card-header>
            <mat-card-title>{{ tarea.titulo }}</mat-card-title>
            <mat-card-subtitle>Proyecto ID: {{ tarea.id_proyecto }}</mat-card-subtitle>
            <button mat-icon-button color="warn" (click)="eliminarTarea(tarea)" [disabled]="loadingDelete === tarea.id">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-card-header>
          <mat-card-content>
            <p>{{ tarea.descripcion }}</p>
            <p><strong>Estado:</strong> {{ tarea.estado }}</p>
            <p *ngIf="tarea.fecha_vencimiento">
              <strong>Vence:</strong> {{ tarea.fecha_vencimiento | date }}
            </p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary" (click)="cambiarEstado(tarea)">
              <mat-icon>refresh</mat-icon> Cambiar Estado
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </ng-container>

    <ng-template #loadingOrErrorTpl>
      <div class="loading-container">
        <mat-spinner *ngIf="loading"></mat-spinner>
        <div *ngIf="error" class="error-container">
          <p>Error al cargar las tareas</p>
          <button mat-raised-button color="primary" (click)="recargar()">Reintentar</button>
        </div>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
