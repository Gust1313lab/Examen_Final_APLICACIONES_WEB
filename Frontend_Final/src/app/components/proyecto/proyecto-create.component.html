<mat-card>
  <mat-card-header>
    <mat-card-title>Crear Proyecto</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="proyectoForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" required>
        <mat-error *ngIf="proyectoForm.get('nombre')?.hasError('required')">
          El nombre es requerido
        </mat-error>
        <mat-error *ngIf="proyectoForm.get('nombre')?.hasError('minlength')">
          El nombre debe tener al menos 3 caracteres
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha límite</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fecha_limite">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" [disabled]="proyectoForm.invalid || loading">
        {{ loading ? 'Creando...' : 'Crear Proyecto' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
